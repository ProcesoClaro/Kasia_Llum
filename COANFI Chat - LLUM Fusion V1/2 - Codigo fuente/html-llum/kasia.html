<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <!--
        viewport-fit=cover: el chat usa las zonas seguras (notch, barra de inicio).
        interactive-widget=resizes-content: al abrir el teclado del móvil, la
        caja de escritura queda visible (el widget además se ajusta al teclado).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1E5BFF" />
    <meta name="robots" content="noindex" />
    <title>KasIA · LLUM Fusión</title>
    <link rel="icon" href="kasia/kasia-avatar.png" />
    <style>
        html, body { margin: 0; height: 100%; background: #ffffff; }
        /* Solo se ve si el navegador es demasiado antiguo para el chat. */
        .aviso {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 480px; margin: 0 auto; padding: 48px 24px; color: #333;
            line-height: 1.5; text-align: center;
        }
        .aviso a { color: #1E5BFF; }
    </style>
</head>
<body>
    <!--
    ============================================================
    KasIA · LLUM Fusión — página del QR (pantalla completa)
    ------------------------------------------------------------
    Sube kasia.html y la carpeta kasia/ a la raíz de www.llumfusion.com
    (kasia.html y kasia/ deben quedar uno al lado del otro).

      Móvil (QR):          https://www.llumfusion.com/kasia.html
      Tablet del stand:    https://www.llumfusion.com/kasia.html?quiosco=1

    En modo quiosco aparece el botón "Nueva conversación" y el chat
    se borra solo tras 3 minutos sin actividad, para que el siguiente
    visitante no vea los datos del anterior.
    ============================================================
    -->
    <div class="aviso">
        <p><strong>KasIA · LLUM Fusión</strong></p>
        <p>Tu navegador no es compatible con el chat. Actualízalo o visita
        <a href="https://www.llumfusion.com/">llumfusion.com</a>.</p>
    </div>

    <script>
        window.COANFI_CHAT_CONFIG = {
            WEBHOOK_URL: "https://n8n-automation-u76494.vm.elestio.app/webhook/chat-llum",
            FEEDBACK_URL: "https://n8n-automation-u76494.vm.elestio.app/webhook/feedback",
            EVENT_URL: "https://n8n-automation-u76494.vm.elestio.app/webhook/event",
            DISPLAY_MODE: "fullscreen",
            KIOSK: false,
            KIOSK_IDLE_SECONDS: 180,
            KIOSK_WARNING_SECONDS: 20,
            PROMOCION: "llum-fusion",
            ASSISTANT_NAME: "KasIA",
            ASSISTANT_AVATAR: "kasia/kasia-avatar.png",
            LOGO_URL: "kasia/coanfi-isotipo.jpg",
            HEADER_SUBTITLE: "LLUM Fusión · Sagunto",
            BRAND_COLOR: "#1E5BFF",
            BRAND_COLOR_DARK: "#1646C7",
            PRIVACY_URL: "https://www.coanfi.com/politica-privacidad/",
            WELCOME: "Hola, soy KasIA, la asistente virtual de LLUM Fusión 😊 Te cuento todo sobre las nuevas viviendas de protección pública en Sagunto.",
            TOOLTIP_TEXT: "",
            CONSENT_TEXT: "Antes de empezar, necesito que aceptes nuestra política de privacidad.",
            ASK_NAME_TEXT: "¡Gracias! ¿Cómo te llamas?",
            CLOSE_TEXT: "Gracias por tu interés en LLUM Fusión. Si necesitas algo más, puedes escribirnos de nuevo cuando lo desees."
        };
    </script>
    <script src="kasia/coanfi-chat.js?v=1000"></script>
</body>
</html>
